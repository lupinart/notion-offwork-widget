<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="widget-version" content="20261111-5">
  <title>下班倒數</title>
  <style>
:root {
  color-scheme:light dark;
  --blue-600:#4f91c7; --blue-200:#8bbcdf;
  --white:#fff; --ink-900:#37352f; --ink-500:#706e68;
  --mist-50:#f9f8f7; --mist-100:#e4e1db; --mist-200:#e4e1db;
  --slate-900:#252525; --slate-800:#383838; --slate-400:#aaa9a4;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-display:var(--font-body);
  --font-number:var(--font-body);
  --size-24:24px;--size-26:26px;--size-30:30px;--size-44:44px;--size-84:84px;--size-144:144px;
  --type-heading:var(--size-30);--type-status:var(--size-24);--type-metric:var(--size-144);
  --type-unit:var(--size-44);--type-note:var(--size-26);--type-rest:var(--size-84);
  --accent:var(--custom-accent,var(--blue-600)); --surface:var(--mist-50);
  --line:var(--mist-100); --track:var(--mist-200); --ink:var(--ink-900); --muted:var(--ink-500); --clock:var(--white);
  --card-bg:var(--surface); --card-border:var(--line);
  --progress:#a9d4f5; --check:#858179;
}
@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {--accent:var(--custom-accent,var(--blue-200));--surface:var(--slate-900);--line:var(--slate-800);--track:var(--slate-800);--ink:#e5e5e2;--muted:var(--slate-400);--clock:#202020;--header-bg:#2b2b2b;--progress:#82b5da;--check:#858580}
}
:root[data-theme="dark"] {--accent:var(--custom-accent,var(--blue-200));--surface:var(--slate-900);--line:var(--slate-800);--track:var(--slate-800);--ink:#e5e5e2;--muted:var(--slate-400);--clock:#202020;--header-bg:#2b2b2b;--progress:#82b5da;--check:#858580}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent}
body{display:grid;place-items:start center;min-height:100vh;height:auto;padding:16px;font-family:var(--font-body);color:var(--ink)}
main{width:100%;min-width:0;position:relative;border:1px solid var(--card-border);border-radius:16px;overflow:hidden;background:var(--card-bg)}svg{display:block;width:100%;height:auto;overflow:visible}
[hidden]{display:none!important}.surface{fill:var(--card-bg)}
text{fill:var(--ink);font-family:var(--font-body)}
.clock-face{fill:var(--clock);stroke:var(--check)}.clock-dots{fill:var(--muted);opacity:.6}.clock-hands{stroke:var(--ink)}
.heading{font:600 var(--type-heading) var(--font-display)}.status{font:400 var(--type-status) var(--font-body);fill:var(--muted)}
.metric{font:600 var(--type-metric) var(--font-number);font-variant-numeric:tabular-nums;letter-spacing:-3px}
.unit{font:600 var(--type-unit) var(--font-body);fill:var(--muted);letter-spacing:0}
.remainder{font:600 var(--type-status) var(--font-number);fill:var(--muted);font-variant-numeric:tabular-nums}
.bar-label{font:400 var(--type-status) var(--font-number);fill:var(--muted)}.bar-percent{font:600 var(--type-note) var(--font-number);fill:var(--ink)}
.rest-main{font:600 var(--type-rest) var(--font-display)}.rest-note{font:400 var(--type-note) var(--font-body);fill:var(--muted)}
.steam{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;animation:steam 4s ease-in-out infinite}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#error{margin:0 16px;padding:16px;line-height:1.6;border-radius:16px;background:var(--surface);color:var(--ink)}
@media(prefers-reduced-motion:reduce){.steam{animation:none}#second-hand{display:none}}
body[data-paused="true"] .steam{animation-play-state:paused}
  </style>
  <script>
// 之後要改時間、文案或配色，集中改這裡即可；不需改版面程式。
globalThis.OFFWORK_CONFIG = {
  timezone: 'Asia/Taipei',
  start: '08:00',
  end: '17:00',
  workdays: [1, 2, 3, 4, 5], // 0週日、1週一 … 6週六
  theme: 'auto',
  colors: {
    lightAccent: '#4f91c7', darkAccent: '#8bbcdf',
    lightSurface: '#f9f8f7', darkSurface: '#252525',
  },
  text: {
    workingTitle: '距離下班還有', workingStatus: '努力上班中',
    beforeTitle: '距離上班還有', beforeStatus: '慢慢準備就好',
    offTitle: '今天辛苦了', offStatus: '下班啦', offMain: '下班啦',
    offNote: '把時間留給自己',
    restTitle: '今天休息', restStatus: '好好充電', restMain: '好好休息',
    restNote: '今天不趕時間，慢慢來',
    progressLabel: '今日上班進度',
  },
};
  </script>
  <script defer src="timer.js?v=20261111-5"></script>
  <script defer src="widget.js?v=20261111-5"></script>
</head>
<body>
<main id="card" aria-label="下班倒數小工具">
  <svg viewBox="0 0 512 512" aria-labelledby="card-title" aria-describedby="card-desc" role="img">
    <title id="card-title">下班倒數</title>
    <desc id="card-desc">正在讀取台灣時間。</desc>
    <defs>
      <clipPath id="track-clip"><rect x="80" y="372" width="352" height="30" rx="15"/></clipPath>
      <clipPath id="progress-clip"><rect id="fill-clip" x="80" y="372" width="0" height="30" rx="15"/></clipPath>
    </defs>
    <rect class="surface" width="512" height="512"/>
    <g id="clock" aria-hidden="true">
      <circle cx="132" cy="122" r="52" class="clock-face" stroke-width="5"/>
      <g class="clock-dots"><circle cx="132" cy="86" r="4"/><circle cx="168" cy="122" r="4"/><circle cx="132" cy="158" r="4"/><circle cx="96" cy="122" r="4"/></g>
      <g class="clock-hands" stroke-linecap="round"><path id="hour-hand" d="M132 122V96" stroke-width="8"/><path id="minute-hand" d="M132 122V82" stroke-width="5"/></g>
      <path id="second-hand" d="M132 130V79" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="132" cy="122" r="6" fill="var(--accent)"/>
    </g>
    <g id="coffee" aria-hidden="true" hidden>
      <circle cx="132" cy="122" r="60" fill="var(--track)"/>
      <path class="steam" d="M110 99q-12-12 0-25M132 96q-12-12 0-25M154 99q-12-12 0-25"/>
      <path d="M165 111h9a16 16 0 0 1 0 32h-9" fill="none" stroke="var(--accent)" stroke-width="8"/>
      <path d="M95 109h70v31q0 26-35 26t-35-26z" fill="var(--accent)"/>
      <path d="M91 171h82" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text id="heading" x="206" y="112" class="heading">下班倒數</text>
    <text id="status" x="206" y="152" class="status">正在讀取時間</text>
    <g id="countdown">
      <text x="256" y="309" text-anchor="middle" class="metric"><tspan id="hours">—</tspan><tspan class="unit" dx="12">小時</tspan></text>
      <text id="remainder" x="256" y="351" text-anchor="middle" class="remainder">— 分 — 秒</text>
    </g>
    <g id="rest" hidden>
      <text id="rest-main" x="256" y="319" text-anchor="middle" class="rest-main">下班啦</text>
      <text id="rest-note" x="256" y="391" text-anchor="middle" class="rest-note">把時間留給自己</text>
    </g>
    <g id="progress-area" aria-hidden="true">
      <rect x="80" y="372" width="352" height="30" rx="15" fill="var(--track)"/>
      <g clip-path="url(#track-clip)"><g clip-path="url(#progress-clip)">
        <rect x="80" y="372" width="352" height="30" fill="var(--custom-accent,var(--progress))"/>
      </g></g>
      <text id="start" x="80" y="444" class="bar-label">08:00</text>
      <text id="percent" x="256" y="444" text-anchor="middle" class="bar-percent">0%</text>
      <text id="end" x="432" y="444" text-anchor="end" class="bar-label">17:00</text>
    </g>
  </svg>
  <div id="accessible-progress" class="sr-only" role="progressbar" aria-label="今日上班進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  <p id="error" role="alert" hidden></p>
  <noscript>請開啟JavaScript，才能顯示即時下班倒數。</noscript>
</main>
</body>
</html>
